name: Assign eligible issues to Copilot

on:
  issues:
    types: [opened]

permissions: {}

jobs:
  assign:
    if: github.event.issue.user.type == 'User'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the author and assign Copilot
        uses: actions/github-script@v8
        env:
          COPILOT_ASSIGNMENT_TOKEN: ${{ secrets.COPILOT_TOKEN }}
        with:
          github-token: ${{ secrets.COPILOT_TOKEN || github.token }}
          script: |
            if (!process.env.COPILOT_ASSIGNMENT_TOKEN) {
              core.setFailed('Configure COPILOT_ASSIGNMENT_TOKEN with a user token authorized to assign Copilot.');
              return;
            }

            const issue = context.payload.issue;
            const author = issue.user.login;
            let eligible = ['OWNER', 'CONTRIBUTOR'].includes(issue.author_association);

            if (!eligible) {
              const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                ...context.repo,
                username: author
              });
              eligible = ['admin', 'maintain', 'write'].includes(data.permission)
                || data.user?.permissions?.push === true;
            }

            if (!eligible) {
              core.notice(`Issue #${issue.number}: @${author} is not an owner, contributor or developer; skipping.`);
              return;
            }

            const copilot = 'copilot-swe-agent[bot]';
            if (issue.assignees.some(assignee => assignee.login === copilot)) {
              core.info(`Issue #${issue.number} is already assigned to Copilot.`);
              return;
            }

            const { data } = await github.request('POST /repos/{owner}/{repo}/issues/{issue_number}/assignees', {
              ...context.repo,
              issue_number: issue.number,
              assignees: [copilot],
              agent_assignment: {
                target_repo: `${context.repo.owner}/${context.repo.repo}`,
                base_branch: context.payload.repository.default_branch
              },
              headers: { 'X-GitHub-Api-Version': '2022-11-28' }
            });

            if (!data.assignees.some(assignee => assignee.login === copilot)) {
              core.setFailed('Copilot was not assigned. Check agent availability, token permissions and repository policies.');
              return;
            }

            core.info(`Issue #${issue.number} assigned to Copilot for resolution.`);