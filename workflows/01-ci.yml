name: ExcuseOps delivery
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: excuseops-delivery-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: '10.0.x'
  ARTIFACT_NAME: excuseops-${{ github.run_id }}-${{ github.run_attempt }}
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out the source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Build and test
        run: dotnet test ExcuseOps.slnx --configuration Release --logger trx
      - name: Publish a deployment ZIP
        shell: pwsh
        run: ./scripts/Publish-Demo.ps1
      - name: Keep the ZIP after the runner disappears
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: out/excuseops.zip
          if-no-files-found: error
          retention-days: 7
      - name: Our own composite action
        uses: ./.github/actions/release-summary
        with:
          artifact-name: ${{ env.ARTIFACT_NAME }}
          stage: CI
