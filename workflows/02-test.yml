name: ExcuseOps delivery
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Serialize the WHOLE promotion, including a human approval wait.
concurrency:
  group: excuseops-delivery-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: '10.0.x'
  ARTIFACT_NAME: excuseops-${{ github.run_id }}-${{ github.run_attempt }}
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Build and test on an isolated runner
        run: dotnet test ExcuseOps.slnx --configuration Release --logger trx

  package:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet restore ExcuseOps.slnx
      - name: Package once after both matrix legs pass
        shell: pwsh
        run: ./scripts/Publish-Demo.ps1
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: out/excuseops.zip
          if-no-files-found: error
          retention-days: 7
      - uses: ./.github/actions/release-summary
        with:
          artifact-name: ${{ env.ARTIFACT_NAME }}
          stage: Package after Linux + Windows tests

  deploy_test:
    name: Deploy TEST
    needs: package
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: test
      url: ${{ vars.APP_URL }}
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      APP_URL: ${{ vars.APP_URL }}
      EXPECTED_STAGE: test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Fail early for missing environment configuration
        shell: pwsh
        env:
          DEMO_API_KEY: ${{ secrets.DEMO_API_KEY }}
        run: ./scripts/Assert-DeploymentConfig.ps1
      - name: Download, do not rebuild
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: deploy
      - name: Exchange GitHub OIDC token for a short-lived Azure token
        uses: azure/login@8216e11d8cd9b42fe925c852af8e76311ff067ac # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy the ZIP with Entra authentication
        uses: azure/webapps-deploy@b686016b4de8820a23519503685d8d03fbfa03a6 # v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          resource-group-name: ${{ vars.AZURE_RESOURCE_GROUP }}
          package: deploy/excuseops.zip
      - name: Smoke test with the environment secret, never echo it
        shell: pwsh
        env:
          DEMO_API_KEY: ${{ secrets.DEMO_API_KEY }}
        run: ./scripts/Test-DeployedApp.ps1
      - uses: ./.github/actions/release-summary
        with:
          artifact-name: ${{ env.ARTIFACT_NAME }}
          stage: TEST deployed + VIP verified
